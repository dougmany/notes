<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Game</title>
    <style>
        :root {
            --bg-color: #2d5e2e;
            --card-radius: 8px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            font-style: italic;
            text-shadow: 1px 1px 2px black;
        }

        .controls { display: flex; gap: 10px; align-items: center; }

        button {
            padding: 8px 16px;
            background: #4a7c43;
            border: 1px solid #6fa363;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        button:hover:not(:disabled) { background: #5a9463; }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Piles */
        #piles-section {
            width: 100%;
            max-width: 800px;
            margin-bottom: 40px;
        }

        .piles-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .piles-header span {
            width: 200px;
            text-align: center;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.75;
        }

        #piles {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pile-group { display: flex; gap: 15px; padding-bottom: 28px; }

        .pile-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pile-count {
            position: absolute;
            bottom: -22px;
            color: white;
            font-size: 14px;
        }

        .pile-divider {
            width: 2px;
            height: 168px;
            background: rgba(255,255,255,0.2);
            margin: 0 10px;
        }

        .pile {
            width: 95px;
            height: 140px;
            background: white;
            border-radius: var(--card-radius);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.12s, box-shadow 0.15s;
            box-shadow: 2px 3px 6px rgba(0,0,0,0.35);
            color: #333;
            padding: 10px 4px;
        }

        .pile.up   { border-color: #3b6bb3; }
        .pile.down { border-color: #b33b3b; }

        .pile.valid-target {
            box-shadow: 0 0 0 3px #00e676, 2px 3px 10px rgba(0,0,0,0.4);
            border-color: #00e676;
            transform: scale(1.06);
        }

        .pile.reverse-target {
            box-shadow: 0 0 0 3px #ff9800, 2px 3px 10px rgba(0,0,0,0.4);
            border-color: #ff9800;
            transform: scale(1.06);
        }

        .pile-arrow { font-size: 1.5rem; }
        .pile.up   .pile-arrow { color: #3b6bb3; }
        .pile.down .pile-arrow { color: #b33b3b; }

        .pile-value {
            font-size: 2.4rem;
            font-weight: bold;
            color: #111;
            line-height: 1;
        }

        .pile-hint {
            font-size: 0.62rem;
            color: #aaa;
        }

        /* Hand */
        #hand-section {
            width: 100%;
            max-width: 800px;
            margin-bottom: 25px;
        }

        #hand-label {
            text-align: center;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.75;
            margin-bottom: 12px;
        }

        #hand {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            min-height: 110px;
        }

        .hand-card {
            width: 72px;
            height: 104px;
            background: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.9rem;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #ddd;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 1px 2px 5px rgba(0,0,0,0.3);
            color: #222;
        }

        .hand-card:hover {
            transform: translateY(-8px);
            box-shadow: 2px 8px 12px rgba(0,0,0,0.4);
        }

        .hand-card.selected {
            box-shadow: 0 0 0 3px #ffff00, 1px 4px 10px rgba(0,0,0,0.5);
            transform: translateY(-14px);
            background: #fffde7;
        }

        .hand-card.no-moves { opacity: 0.38; }

        /* Status bar */
        #status-bar {
            width: 100%;
            max-width: 800px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }

        .stat {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            padding: 4px 12px;
            border-radius: 20px;
            margin-right: 10px;
            font-size: 0.9rem;
        }

        .rules-hint {
            width: 100%;
            max-width: 800px;
            margin-top: 18px;
            font-size: 0.78rem;
            opacity: 0.55;
            text-align: center;
            line-height: 1.7;
        }

        /* Error toast */
        #error-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #ff6b6b;
            font-weight: bold;
            padding: 10px 22px;
            border-radius: 6px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
            z-index: 3000;
        }

        /* Modals */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.82);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 2000;
            gap: 16px;
        }

        .modal h2 { font-size: 3rem; margin: 0; }
        .modal p  { font-size: 1.05rem; opacity: 0.8; margin: 0; }
        .modal .btn-row { display: flex; gap: 12px; margin-top: 8px; }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .result-box {
            background: #1a3d1a;
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            padding: 30px 36px;
            max-width: 460px;
            width: 92%;
            max-height: 92vh;
            overflow-y: auto;
            text-align: center;
        }

        .result-box h2 { font-size: 2.4rem; margin: 0 0 4px; }
        .result-box > p { margin: 0 0 16px; opacity: 0.72; font-size: 0.9rem; }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 2px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            opacity: 0;
            animation: fadeSlideIn 0.3s ease forwards;
        }

        .stat-name { font-size: 0.85rem; opacity: 0.7; }
        .stat-val  { font-weight: bold; font-size: 1rem; }

        .hs-section {
            margin-top: 18px;
            border-top: 1px solid rgba(255,255,255,0.12);
            padding-top: 14px;
            opacity: 0;
            animation: fadeSlideIn 0.3s ease forwards;
        }

        .hs-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.5;
            margin-bottom: 10px;
        }

        .hs-row {
            display: grid;
            grid-template-columns: 26px 1fr 1fr 1fr 1fr;
            font-size: 0.78rem;
            padding: 3px 4px;
            border-radius: 4px;
            text-align: right;
        }

        .hs-row > span:first-child { text-align: left; }

        .hs-row.hs-head {
            opacity: 0.45;
            font-size: 0.67rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 2px;
        }

        .hs-row.hs-current {
            background: rgba(80,200,80,0.18);
            color: #90f090;
            font-weight: bold;
        }

        .hs-not-ranked {
            font-size: 0.72rem;
            opacity: 0.45;
            margin-top: 8px;
        }

        .result-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 22px;
        }
    </style>
</head>
<body>

<header>
    <h1>The Game</h1>
    <div class="controls">
        <button onclick="game.undo()">Undo</button>
        <button onclick="game.restart()">New Game</button>
    </div>
</header>

<div id="piles-section">
    <div class="piles-header">
        <span>↑ Ascending Piles</span>
        <span>↓ Descending Piles</span>
    </div>
    <div id="piles"></div>
</div>

<div id="hand-section">
    <div id="hand-label">Your Hand</div>
    <div id="hand"></div>
</div>

<div id="status-bar">
    <div id="status-text"></div>
    <button id="draw-btn" onclick="game.endTurn()">Draw Cards</button>
    <button onclick="game.sortHand()">Sort Hand</button>
</div>

<div class="rules-hint">
    Select a card, then click a pile to play it. &nbsp;|&nbsp;
    ↑ piles: must play <strong>higher</strong> &nbsp;|&nbsp;
    ↓ piles: must play <strong>lower</strong> &nbsp;|&nbsp;
    <strong>Exception:</strong> a card exactly <strong>10 away in reverse</strong> is always legal &nbsp;|&nbsp;
    Play at least <strong>2 cards</strong> before drawing (1 when deck is empty)
</div>

<div id="error-msg"></div>

<div id="result-modal" class="modal">
    <div class="result-box">
        <h2 id="result-title"></h2>
        <p id="result-subtitle"></p>
        <div id="result-body"></div>
        <div class="result-btns">
            <button id="r-undo-btn" onclick="game.undoFromResult()" style="display:none">Undo Last Move</button>
            <button onclick="game.restart()">New Game</button>
        </div>
    </div>
</div>

<script>
class TheGame {
    constructor() {
        this.piles = [1, 1, 100, 100];
        this.pileCounts = [0, 0, 0, 0];
        this.pileTypes = ['up', 'up', 'down', 'down'];
        this.deck = [];
        this.hand = [];
        this.cardsPlayedThisTurn = 0;
        this.selectedCardIndex = null;
        this.history = [];
        this.gameOver = false;
        this.reversesPlayed = 0;
        this.longestTurn = 0;
        this.largestGap = 0;

        this.restart();
    }

    restart() {
        this.deck = [];
        for (let i = 2; i <= 99; i++) this.deck.push(i);
        this.shuffle(this.deck);

        this.piles = [1, 1, 100, 100];
        this.pileCounts = [0, 0, 0, 0];
        this.hand = [];
        this.cardsPlayedThisTurn = 0;
        this.selectedCardIndex = null;
        this.history = [];
        this.gameOver = false;
        this.reversesPlayed = 0;
        this.longestTurn = 0;
        this.largestGap = 0;

        for (let i = 0; i < 8; i++) this.hand.push(this.deck.pop());

        document.getElementById('result-modal').style.display = 'none';
        this.render();
    }

    shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
    }

    canPlay(card, pileIndex) {
        const top = this.piles[pileIndex];
        if (this.pileTypes[pileIndex] === 'up') {
            return card > top || card === top - 10;
        } else {
            return card < top || card === top + 10;
        }
    }

    isReverse(card, pileIndex) {
        const top = this.piles[pileIndex];
        return this.pileTypes[pileIndex] === 'up'
            ? card === top - 10
            : card === top + 10;
    }

    saveState() {
        this.history.push({
            piles: [...this.piles],
            pileCounts: [...this.pileCounts],
            hand: [...this.hand],
            deck: [...this.deck],
            cardsPlayedThisTurn: this.cardsPlayedThisTurn,
            reversesPlayed: this.reversesPlayed,
            largestGap: this.largestGap,
        });
        if (this.history.length > 50) this.history.shift();
    }

    undo() {
        if (this.history.length === 0) return;
        const s = this.history.pop();
        this.piles = s.piles;
        this.pileCounts = s.pileCounts;
        this.hand = s.hand;
        this.deck = s.deck;
        this.cardsPlayedThisTurn = s.cardsPlayedThisTurn;
        this.reversesPlayed = s.reversesPlayed;
        this.largestGap = s.largestGap;
        this.selectedCardIndex = null;
        this.gameOver = false;
        document.getElementById('result-modal').style.display = 'none';
        this.render();
    }

    selectCard(index) {
        if (this.selectedCardIndex === null) {
            this.selectedCardIndex = index;
        } else if (this.selectedCardIndex === index) {
            this.selectedCardIndex = null;
        } else {
            // Swap the two cards in hand
            [this.hand[this.selectedCardIndex], this.hand[index]] =
                [this.hand[index], this.hand[this.selectedCardIndex]];
            this.selectedCardIndex = null;
        }
        this.render();
    }

    sortHand() {
        this.hand.sort((a, b) => a - b);
        this.selectedCardIndex = null;
        this.render();
    }

    playCard(pileIndex) {
        if (this.selectedCardIndex === null || this.gameOver) return;
        const card = this.hand[this.selectedCardIndex];
        if (!this.canPlay(card, pileIndex)) return;

        this.saveState();
        const gap = Math.abs(card - this.piles[pileIndex]);
        const rev = this.isReverse(card, pileIndex);
        this.piles[pileIndex] = card;
        this.pileCounts[pileIndex]++;
        this.hand.splice(this.selectedCardIndex, 1);
        this.selectedCardIndex = null;
        this.cardsPlayedThisTurn++;
        if (rev) {
            this.reversesPlayed++;
        } else if (gap > this.largestGap) {
            this.largestGap = gap;
        }

        this.render();
        this.checkGameState();
    }

    endTurn() {
        if (this.gameOver) return;
        const minPlays = this.deck.length > 0 ? 2 : 1;
        if (this.cardsPlayedThisTurn < minPlays) {
            this.showError(`Play at least ${minPlays} card${minPlays > 1 ? 's' : ''} first!`);
            return;
        }

        if (this.cardsPlayedThisTurn > this.longestTurn) this.longestTurn = this.cardsPlayedThisTurn;
        while (this.hand.length < 8 && this.deck.length > 0) {
            this.hand.push(this.deck.pop());
        }
        this.cardsPlayedThisTurn = 0;
        this.selectedCardIndex = null;

        this.render();
        this.checkGameState();
    }

    checkGameState() {
        if (this.cardsPlayedThisTurn > this.longestTurn) this.longestTurn = this.cardsPlayedThisTurn;

        if (this.deck.length === 0 && this.hand.length === 0) {
            this.showResult(true);
            return;
        }

        const minPlays = this.deck.length > 0 ? 2 : 1;
        if (this.cardsPlayedThisTurn < minPlays && this.hand.length > 0) {
            const stuck = !this.hand.some(card =>
                [0, 1, 2, 3].some(pi => this.canPlay(card, pi))
            );
            if (stuck) {
                this.gameOver = true;
                this.showResult(false);
            }
        }
    }

    getHighScores() {
        try { return JSON.parse(localStorage.getItem('tg_hs')) || []; }
        catch { return []; }
    }

    recordHighScore(entry) {
        const list = this.getHighScores();
        list.push(entry);
        list.sort((a, b) => b.cards !== a.cards ? b.cards - a.cards : b.reverses - a.reverses);
        const rank = list.indexOf(entry) + 1;
        if (list.length > 10) list.length = 10;
        try { localStorage.setItem('tg_hs', JSON.stringify(list)); } catch {}
        return { list, rank: rank <= 10 ? rank : -1 };
    }

    showResult(won) {
        const totalPlayed = this.pileCounts.reduce((a, b) => a + b, 0);
        const entry = {
            cards: totalPlayed,
            reverses: this.reversesPlayed,
            longestTurn: this.longestTurn,
            largestGap: this.largestGap,
        };
        const { list, rank } = this.recordHighScore(entry);

        document.getElementById('result-title').textContent = won ? 'YOU WIN!' : 'GAME OVER';
        document.getElementById('result-title').style.color = won ? 'gold' : '#ff6b6b';
        document.getElementById('result-subtitle').textContent = won
            ? 'Every card has been played!'
            : 'No valid moves remaining.';

        const body = document.getElementById('result-body');
        body.innerHTML = '';
        let delay = 0.1;

        const statsData = [
            ['Cards Played', `${totalPlayed} / 98`],
            ['Reverse Plays (10-away)', this.reversesPlayed],
            ['Longest Turn', `${this.longestTurn} cards`],
            ['Largest Gap', this.largestGap],
        ];
        statsData.forEach(([name, val]) => {
            const row = document.createElement('div');
            row.className = 'stat-row';
            row.style.animationDelay = `${delay}s`;
            delay += 0.18;
            row.innerHTML = `<span class="stat-name">${name}</span><span class="stat-val">${val}</span>`;
            body.appendChild(row);
        });

        delay += 0.1;
        const hsWrap = document.createElement('div');
        hsWrap.className = 'hs-section';
        hsWrap.style.animationDelay = `${delay}s`;

        const hsLabel = document.createElement('div');
        hsLabel.className = 'hs-label';
        hsLabel.textContent = 'Top 10';
        hsWrap.appendChild(hsLabel);

        const header = document.createElement('div');
        header.className = 'hs-row hs-head';
        header.innerHTML = '<span>#</span><span>Cards</span><span>Rev</span><span>Turn</span><span>Gap</span>';
        hsWrap.appendChild(header);

        list.forEach((hs, i) => {
            const row = document.createElement('div');
            row.className = 'hs-row' + ((i + 1) === rank ? ' hs-current' : '');
            row.innerHTML = `<span>#${String(i+1).padStart(2,'0')}</span><span>${hs.cards}/98</span><span>${hs.reverses}</span><span>${hs.longestTurn}</span><span>${hs.largestGap}</span>`;
            hsWrap.appendChild(row);
        });

        if (rank === -1) {
            const note = document.createElement('div');
            note.className = 'hs-not-ranked';
            note.textContent = `Your score: ${totalPlayed}/98 (not in top 10)`;
            hsWrap.appendChild(note);
        }

        body.appendChild(hsWrap);

        const undoBtn = document.getElementById('r-undo-btn');
        undoBtn.style.display = (!won && this.history.length > 0) ? 'inline-block' : 'none';
        document.getElementById('result-modal').style.display = 'flex';
    }

    undoFromResult() {
        document.getElementById('result-modal').style.display = 'none';
        this.undo();
    }

    showError(msg) {
        const el = document.getElementById('error-msg');
        el.textContent = msg;
        el.style.opacity = '1';
        clearTimeout(this._errTimer);
        this._errTimer = setTimeout(() => { el.style.opacity = '0'; }, 2200);
    }

    render() {
        // --- Piles ---
        const pilesEl = document.getElementById('piles');
        pilesEl.innerHTML = '';

        const upGroup   = document.createElement('div');
        upGroup.className = 'pile-group';
        const divider   = document.createElement('div');
        divider.className = 'pile-divider';
        const downGroup = document.createElement('div');
        downGroup.className = 'pile-group';

        this.piles.forEach((top, pi) => {
            const type    = this.pileTypes[pi];
            const wrapper = document.createElement('div');
            wrapper.className = 'pile-wrapper';

            const pileEl = document.createElement('div');
            pileEl.className = `pile ${type}`;

            if (this.selectedCardIndex !== null) {
                const cv = this.hand[this.selectedCardIndex];
                if (this.canPlay(cv, pi)) {
                    pileEl.classList.add(this.isReverse(cv, pi) ? 'reverse-target' : 'valid-target');
                }
            }

            pileEl.onclick = () => this.playCard(pi);
            pileEl.innerHTML = `
                <div class="pile-arrow">${type === 'up' ? '↑' : '↓'}</div>
                <div class="pile-value">${top}</div>
                <div class="pile-hint">${type === 'up' ? 'started at 1' : 'started at 100'}</div>
            `;

            const countEl = document.createElement('div');
            countEl.className = 'pile-count';
            countEl.textContent = this.pileCounts[pi];

            wrapper.appendChild(pileEl);
            wrapper.appendChild(countEl);
            (pi < 2 ? upGroup : downGroup).appendChild(wrapper);
        });

        pilesEl.appendChild(upGroup);
        pilesEl.appendChild(divider);
        pilesEl.appendChild(downGroup);

        // --- Hand ---
        const handEl = document.getElementById('hand');
        handEl.innerHTML = '';
        this.hand.forEach((cv, i) => {
            const cardEl = document.createElement('div');
            cardEl.className = 'hand-card';
            if (i === this.selectedCardIndex) cardEl.classList.add('selected');
            if (![0, 1, 2, 3].some(pi => this.canPlay(cv, pi))) cardEl.classList.add('no-moves');
            cardEl.textContent = cv;
            cardEl.onclick = () => this.selectCard(i);
            handEl.appendChild(cardEl);
        });

        // --- Status ---
        const minPlays = this.deck.length > 0 ? 2 : 1;
        document.getElementById('status-text').innerHTML = `
            <span class="stat">Deck: ${this.deck.length}</span>
            <span class="stat">Hand: ${this.hand.length}</span>
            <span class="stat">Played this turn: ${this.cardsPlayedThisTurn} / ${minPlays} min</span>
        `;

        const btn = document.getElementById('draw-btn');
        btn.disabled = this.cardsPlayedThisTurn < minPlays;
        btn.textContent = this.deck.length > 0 ? 'Draw Cards' : 'End Turn';
    }
}

const game = new TheGame();
</script>
</body>
</html>
